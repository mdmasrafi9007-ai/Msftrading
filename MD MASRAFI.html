<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MD MASRAFI</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"><style id="css">
/* Layout: sticky slim header, hero with framed portrait, stacked content sections on a charcoal ground separated by gold hairlines. Black & gold luxury. */
:root{
  --bg:#0b0a08; --bg2:#12100c; --card:#171410; --line:#2c2519; --line2:#3d3320;
  --ink:#f4efe4; --muted:#a79e8b; --gold:#c9a24b; --gold2:#e8cc83; --goldink:#1a1407;
  --ok:#6fbf8b; --warn:#e0b45a; --bad:#e07a6f; --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  --disp:"Cormorant Garamond","Hind Siliguri","Tajawal",Georgia,serif;
  --body:"Manrope","Hind Siliguri","Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#faf7f0; --bg2:#f3eee2; --card:#ffffff; --line:#e4dac3; --line2:#cdbd96;
  --ink:#1c1710; --muted:#5f5646; --gold:#8c6a1c; --gold2:#a8801f; --goldink:#fffaf0;
  --ok:#2c7a4b; --warn:#8a5d00; --bad:#b0392c; --shadow:0 18px 36px -24px rgba(60,44,10,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body{padding-inline:0}
body{position:relative}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(75vmax 75vmax at 25% 25%,rgba(227,195,111,.5),transparent 70%),radial-gradient(65vmax 65vmax at 80% 52%,rgba(201,162,75,.42),transparent 70%),radial-gradient(75vmax 75vmax at 28% 80%,rgba(227,195,111,.4),transparent 70%),conic-gradient(from 210deg at 60% 40%,transparent 0 52%,rgba(227,195,111,.18) 62%,transparent 74%);animation:bgdrift 16s ease-in-out infinite alternate;will-change:transform}
body::after{content:"";position:fixed;inset:-420px 0 0 0;z-index:-1;pointer-events:none;opacity:.8;background-image:radial-gradient(1.6px 1.6px at 40px 60px,rgba(255,226,140,.9),transparent),radial-gradient(1.2px 1.2px at 210px 140px,rgba(255,226,140,.7),transparent),radial-gradient(2px 2px at 330px 300px,rgba(255,226,140,.8),transparent),radial-gradient(1.2px 1.2px at 120px 360px,rgba(255,226,140,.6),transparent),radial-gradient(1.5px 1.5px at 380px 40px,rgba(255,226,140,.7),transparent);background-size:420px 420px;animation:dust 28s linear infinite,twk 5s ease-in-out infinite alternate;will-change:transform}
@keyframes bgdrift{50%{transform:translate3d(5%,4%,0) rotate(2deg) scale(1.12)}to{transform:translate3d(-4%,6%,0) scale(1.05)}}
@keyframes dust{to{transform:translateY(420px)}}
@keyframes twk{from{opacity:.45}to{opacity:.95}}
@keyframes glowp{50%{box-shadow:0 0 28px rgba(227,195,111,.38)}}
.btn.gold:not(:hover){animation:glowp 3.8s ease-in-out infinite}
h1,.hl{text-shadow:0 0 34px rgba(227,195,111,.22)}
@media(prefers-reduced-motion:reduce){body::before,body::after,.btn.gold{animation:none!important}}

a{color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0 0 .9em}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:10px;height:62px}
.logo{font-family:var(--disp);font-size:1.45rem;font-weight:700;letter-spacing:.14em;text-decoration:none;color:var(--gold2);white-space:nowrap}
.topnav{display:none;gap:4px;margin-inline-start:18px}
.topnav a{white-space:nowrap;padding:8px 11px;font-size:.88rem;color:var(--muted);text-decoration:none;border-radius:8px}
.topnav a:hover{color:var(--gold2)}
.sp{flex:1}
.ibtn,.sel{height:40px;min-width:40px;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover,.sel:hover{border-color:var(--gold);color:var(--gold2)}
.sel{appearance:none;-webkit-appearance:none;padding-inline:12px;background:var(--bg);width:auto;min-width:52px;min-height:40px}
.mpanel{border-bottom:1px solid var(--line);background:var(--bg2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding-block:14px}
.mgrid a{padding:11px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:.92rem}
.mgrid a:hover{border-color:var(--gold);color:var(--gold2)}
@media(min-width:900px){.topnav{display:flex}}
@media(max-width:430px){.logo{font-size:1.18rem;letter-spacing:.1em}.hdr .wrap{gap:8px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldink);border-color:transparent}
.btn.gold:hover{color:var(--goldink);transform:translateY(-1px);filter:brightness(1.06)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.84rem;border-radius:9px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--bg2) 40%,transparent),transparent)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.28;-webkit-mask:radial-gradient(ellipse at 70% 30%,#000,transparent 70%);mask:radial-gradient(ellipse at 70% 30%,#000,transparent 70%)}
.hero .wrap{position:relative;display:grid;gap:34px;padding-block:56px 64px;align-items:center}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.25fr .75fr;padding-block:84px 92px}}
.eyebrow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(2.7rem,8vw,5rem);letter-spacing:.06em}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hl{font-family:var(--disp);font-size:1.5rem;color:var(--gold2);margin:12px 0 0}
.tag{max-width:54ch;color:var(--muted);font-size:1.06rem;margin:16px 0 26px}
.soc{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.soc a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;text-decoration:none;font-size:.86rem;color:var(--muted)}
.soc a:hover{border-color:var(--gold);color:var(--gold2)}
.frame{justify-self:center;width:min(300px,72vw);aspect-ratio:1;border-radius:50%;padding:6px;background:linear-gradient(135deg,var(--gold2),var(--line2) 45%,var(--gold));box-shadow:var(--shadow)}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:5px solid var(--bg)}
.rise{animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* sections */
.sec{padding-block:68px;border-bottom:1px solid var(--line)}
.sec:nth-of-type(even){background:color-mix(in srgb,var(--bg2) 45%,transparent)}
.sh{display:flex;flex-direction:column;gap:8px;margin-bottom:30px;max-width:720px}
.sh h2{font-size:clamp(1.9rem,4.5vw,2.8rem)}
.sh h2::after{content:"";display:block;width:56px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:12px}
:root[dir="rtl"] .sh h2::after{background:linear-gradient(270deg,var(--gold),transparent)}
.sh p{color:var(--muted);margin:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;transition:border-color .25s,transform .25s}
.card.hov:hover{border-color:var(--gold);transform:translateY(-2px)}
.card h3{font-size:1.35rem;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-block;padding:3px 10px;border:1px solid var(--line2);border-radius:999px;font-size:.74rem;letter-spacing:.06em;color:var(--gold2);margin:0 6px 6px 0}
:root[dir="rtl"] .pill{margin:0 0 6px 6px}
.empty{padding:26px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
.two{display:grid;gap:26px}
@media(min-width:820px){.two{grid-template-columns:1.2fr .8fr}}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dl.kv dt{color:var(--gold2);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{min-height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--goldink);font-weight:600}
.cover{aspect-ratio:16/10;background:var(--bg2) center/cover;border-radius:10px;margin-bottom:14px;border:1px solid var(--line)}
.tl{display:grid;gap:16px;border-inline-start:1px solid var(--line2);padding-inline-start:22px}
.tl .card{position:relative}
.tl .card::before{content:"";position:absolute;inset-inline-start:-29px;top:26px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--bg2)}
.note{border:1px solid var(--line2);border-inline-start:3px solid var(--gold);background:var(--card);border-radius:10px;padding:14px 16px;font-size:.88rem;color:var(--muted)}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
.post-body p{max-width:68ch}

/* plans */
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.plan::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.plan .price{font-family:var(--disp);font-size:2.6rem;font-weight:700;color:var(--gold2);line-height:1}
.plan ul{margin:0;padding-inline-start:18px;color:var(--muted);flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.86rem;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--goldink);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px;align-items:center}

/* forms */
label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:6px;font-weight:500}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font:inherit;font-size:.95rem;min-height:44px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--gold)}
.f{margin-bottom:14px;min-width:0}
.f .err{color:var(--bad);font-size:.8rem;min-height:1em;margin-top:4px}
.fgrid{display:grid;gap:0 14px}
@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .full{grid-column:1/-1}}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,4,2,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet{background:var(--card);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:640px;margin-block:auto;padding:26px;box-shadow:var(--shadow);min-width:0}
.sheet.wide{max-width:980px}
.sheet h2{font-size:1.9rem;margin-bottom:16px}
.xbtn{float:inline-end;margin-inline-start:10px}
.pay{border:1px solid var(--line2);border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pay b{display:block}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;overflow-wrap:anywhere}
.toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;max-width:460px;margin-inline:auto;background:var(--gold);color:var(--goldink);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}


/* quotex partner section */
.qx{position:relative;overflow:hidden;border:1px solid var(--gold);border-radius:22px;padding:30px 24px;text-align:center;background:radial-gradient(520px 260px at 50% 0%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 70%),linear-gradient(160deg,#0d0a04,var(--bg2));box-shadow:var(--shadow);animation:qxin .8s ease both}
@keyframes qxin{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@supports(animation-timeline:view()){.qx{animation-timeline:view();animation-range:entry 0% cover 28%}}
.qx .lbl{display:inline-block;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--gold);border-radius:30px;padding:5px 14px;margin-bottom:16px}
.qx .qi{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold2)}
.qx .qi svg{width:34px;height:34px}
.qx h3{font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.2;margin:0 auto 12px;max-width:24ch}
.qx p{color:var(--muted);max-width:60ch;margin:10px auto 0;font-size:.95rem}
.qx .btn{margin-top:22px;min-height:52px;padding-inline:34px;font-size:1.02rem;transition:transform .2s,box-shadow .2s}
.qx .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 34px color-mix(in srgb,var(--gold) 40%,transparent)}
.qx .risk{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);max-width:62ch;margin-inline:auto}
@media(min-width:780px){.qx{padding:44px 48px}}
/* telegram, dashboard, footer */
.btn.tg{border-color:var(--gold);color:var(--gold2)}
.btn.tg:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stat b{display:block;font-family:var(--disp);font-size:1.9rem;color:var(--gold2);line-height:1.1;overflow-wrap:anywhere}
.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.cta{text-align:center;padding:34px 20px;border:1px solid var(--gold);border-radius:18px;background:linear-gradient(145deg,var(--card),var(--bg2))}
.cta h3{font-size:1.7rem;margin-bottom:8px}
.lead{font-size:1.12rem;color:var(--ink)}
.fcols{display:grid;gap:28px;padding-bottom:22px}
@media(min-width:820px){.fcols{grid-template-columns:1.3fr 1fr 1.2fr}}
footer h4{font-family:var(--body);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin:0 0 10px}
footer .fl{display:grid;gap:6px}
footer .fl a{text-decoration:none;color:var(--muted)}
footer .fl a:hover{color:var(--gold2)}
/* trading: journal, dashboard, notes */
.sh h3.h3g{font-size:1.7rem}
.sh h3.h3g::after{content:"";display:block;width:40px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:10px}
:root[dir="rtl"] .sh h3.h3g::after{background:linear-gradient(270deg,var(--gold),transparent)}
.jlist{display:grid;gap:16px}
.jcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.jhead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.jhead h4{font-family:var(--disp);font-size:1.5rem;margin:2px 0 0;font-weight:600}
.jres{font-family:var(--disp);font-size:1.4rem;font-weight:700;color:var(--muted)}
.jnum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.jnum span{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.jnum b{font-weight:600;overflow-wrap:anywhere}
.jcols{display:grid;gap:16px}
@media(min-width:820px){.jcols{grid-template-columns:repeat(3,1fr)}}
.jcols h5{margin:0 0 6px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:600}
.jcols p{color:var(--muted);font-size:.93rem;margin:0 0 .6em}
.emptyx{border:1px dashed var(--line2);border-radius:16px;padding:28px 22px;background:linear-gradient(180deg,var(--card),transparent)}
.emptyx h4{font-family:var(--disp);font-size:1.45rem;margin:0 0 6px;font-weight:600}
.emptyx p{color:var(--muted);margin:0 0 16px;max-width:60ch}
.eitems{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.eitems li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--muted);background:var(--bg)}
.eitems li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-end:10px;vertical-align:middle}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi .l{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .v{display:block;font-family:var(--disp);font-size:2.5rem;font-weight:700;line-height:1.1;margin:8px 0 4px;color:var(--gold2);overflow-wrap:anywhere}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)}
.kpi .s{font-size:.8rem;color:var(--muted);min-height:1.2em}
.kpi.dim .v{color:var(--line2)}
.kbar{height:5px;border-radius:5px;background:var(--line);margin-top:10px;overflow:hidden}
.kbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.mini{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:.88rem;color:var(--muted)}
.mini b{color:var(--ink);font-weight:600}
.topics{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:22px}
.topic{text-align:start;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-width:0;transition:border-color .2s}
.topic:hover{border-color:var(--gold)}

function merge(base,over){ /* fill any missing keys so older saves keep working */
  if(over==null)return base;
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(typeof base==="object"){var o={};Object.keys(base).forEach(function(k){o[k]=merge(base[k],over[k])});Object.keys(over).forEach(function(k){if(!(k in o))o[k]=over[k]});return o}
  return typeof over===typeof base?over:base;
}

function tstats(rows){
  var r=rows.filter(function(x){return x.result!==""&&x.result!=null&&!isNaN(Number(x.result))}).map(function(x){return {date:x.date||"",res:Number(x.result),risk:Number(x.risk)||0}}).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(!r.length)return null;

  var sum=function(a){return a.reduce(function(t,x){return t+x.res},0)};
  var net=sum(r),avgG=w.length?sum(w)/w.length:null,avgL=l.length?Math.abs(sum(l))/l.length:null;
  var rr=r.filter(function(x){return x.risk>0}),avgR=rr.length?rr.reduce(function(t,x){return t+x.res/x.risk},0)/rr.length:null;
  var cum=[],c=0;r.forEach(function(x){c+=x.res;cum.push(c)});
  return {n:r.length,wins:w.length,losses:l.length,rate:w.length/r.length*100,net:net,avgG:avgG,avgL:avgL,rr:(avgG!=null&&avgL)?avgG/avgL:null,avgR:avgR,cum:cum};
}

  var U=SUPPORT_TG,AV='<svg class="sup-av" viewBox="0 0 64 64" aria-hidden="true"><g class="sup-bob"><path d="M10 64c1-13 10-19 22-19s21 6 22 19z" fill="#1a1407"/><path d="M26 45l6 7 6-7" fill="#f4efe4"/><rect x="28" y="38" width="8" height="8" rx="3" fill="#e2b98f"/><ellipse cx="32" cy="27" rx="13" ry="14" fill="#f3cfa6"/><path d="M18.5 25c0-10 6-15 13.500-15S45.500 15 45.500 25c-3-5-8-7-13.500-7s-10.500 2-13.500 7z" fill="#2a1d0c"/><ellipse class="sup-eye" cx="26.500" cy="28" rx="1.700" ry="2.200" fill="#1a1407"/><ellipse class="sup-eye" cx="37.500" cy="28" rx="1.700" ry="2.200" fill="#1a1407"/><path d="M27.500 34c2.500 2.500 6.500 2.500 9 0" fill="none" stroke="#a0522d" stroke-width="1.600" stroke-linecap="round"/><path d="M17 28v-3c0-9 6-15 15-15s15 6 15 15v3" fill="none" stroke="#e8cc83" stroke-width="2.400" stroke-linecap="round"/><rect x="14.500" y="26" width="5" height="9" rx="2.500" fill="#e8cc83"/><rect x="44.500" y="26" width="5" height="9" rx="2.500" fill="#e8cc83"/><path d="M47 33c0 5-4 8-9 8" fill="none" stroke="#e8cc83" stroke-width="1.800" stroke-linecap="round"/><circle cx="37" cy="41" r="2.200" fill="#e8cc83"/></g></svg>',
  TG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 7 3-4 5 4z"/><path d="M9 13l12-9"/></svg>',
  X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  A=function(c,inner,extra){return '<a class="'+c+'" href="'+U+'" target="_blank" rel="noopener noreferrer" data-sup-tg="1"'+(extra||"")+'>'+inner+'</a>'};
  var root=document.createElement("div");root.id="sup";
  root.innerHTML=
    '<div class="sup-pop" role="dialog" aria-label="Customer support" hidden>'+
      '<button type="button" class="sup-x" aria-label="Close support popup">'+X+'</button>'+
      '<div class="sup-head">'+AV+'<div><b>MD Masrafi Support</b><span><i class="sup-dot"></i>Online</span></div></div>'+
      A("sup-msg typing",'<span class="sup-typing" aria-hidden="true"><i></i><i></i><i></i></span><span class="sup-text">Hello Sir/Madam! How can I help you today?</span>')+
      A("sup-btn gold",TG+'<span>Message Me on Telegram</span>')+
      A("sup-btn",'<span>Contact Support</span>')+
    '</div>'+
    '<div class="sup-dock"><button type="button" class="sup-chip" hidden>Need help? Chat with us</button>'+
      A("sup-fab",AV+'<i class="sup-dot"></i>',' aria-label="Contact support on Telegram"')+'</div>';
  document.body.appendChild(root);
  var pop=root.querySelector(".sup-pop"),chip=root.querySelector(".sup-chip"),msg=root.querySelector(".sup-msg"),tm,tm2,touched=false;
  function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){}return null}
  function openPop(){clearTimeout(tm2);pop.classList.remove("out");pop.hidden=false;chip.hidden=true;msg.classList.add("typing");clearTimeout(tm);tm=setTimeout(function(){msg.classList.remove("typing")},900)}
  function closePop(){touched=true;ss("supClosed","1");pop.classList.add("out");clearTimeout(tm2);tm2=setTimeout(function(){pop.hidden=true;pop.classList.remove("out");chip.hidden=false},200)}
  root.querySelector(".sup-x").onclick=closePop;
  chip.onclick=function(){touched=true;openPop()};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!pop.hidden&&!document.querySelector(".promo,.ov"))closePop()});
  /* appear after a short delay; wait while another site popup is on screen; stay closed if visitor already closed it this visit */
  setTimeout(function go(){
    if(touched)return;
    if(document.querySelector(".promo")){setTimeout(go,1500);return}
    if(ss("supClosed")){chip.hidden=false;return}
    openPop();
  },4000);
})();

/* ---------- boot ---------- */
render();route();
(async function(){
  try{if(!window.claude||!claude.use)return;
    var u=await claude.use("user");
    try{isAdmin=!!(u&&(await u.isOwner()||await u.canEdit()))}catch(e){isAdmin=false}
    dl=await claude.use("downloads");
    if(!isAdmin){render();route();return}
    artifactCap=await claude.use("artifact");
    db=await claude.use("db");
    if(db){
      try{var snap=await db.doc("site/draft").get();if(snap.exists){var v=snap.data();if(v&&v.data)DRAFT=migrate(merge(DEFAULT_DATA(),v.data))}
        var ms=await db.collection("media").get();ms.forEach(function(m){var x=m.data();if(x&&x.u)MEDIA[m.id]=x.u})}catch(e){}
    }
    if(!DRAFT)DRAFT=clone(DATA);
    dirty=false;render();route();
  }catch(e){render()}
})();
})();
</script>
</body></html>
